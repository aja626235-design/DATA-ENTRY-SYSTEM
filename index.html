<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMRAN DIGITAL – CSC Centre</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
background:#0b1030;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#1b1464 0%,#0b1030 45%,#02323f 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 18s ease-in-out infinite}
.b1{width:420px;height:420px;background:#7c3aed;top:-80px;left:-80px}
.b2{width:380px;height:380px;background:#06b6d4;bottom:-60px;right:-60px;animation-delay:-6s}
.b3{width:300px;height:300px;background:#ec4899;top:40%;left:45%;animation-delay:-12s;opacity:.5}
@keyframes float{50%{transform:translate(50px,-40px) scale(1.12)}}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
border:1px solid rgba(255,255,255,.22);border-radius:28px;
box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.45),inset 0 -1px 1px rgba(255,255,255,.08)}
.glass-sm{border-radius:16px}
.card{transition:transform .3s,box-shadow .3s;cursor:pointer}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 50px rgba(124,58,237,.45),inset 0 1px 1px rgba(255,255,255,.5)}
.inp{width:100%;padding:.7rem 1rem;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;outline:none;backdrop-filter:blur(10px)}
.inp::placeholder{color:rgba(255,255,255,.5)}
.inp:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.35)}
.btn{padding:.65rem 1.2rem;border-radius:14px;font-weight:600;background:linear-gradient(135deg,#8b5cf6,#06b6d4);box-shadow:0 6px 20px rgba(139,92,246,.45),inset 0 1px 1px rgba(255,255,255,.4);transition:.2s;display:inline-flex;gap:.4rem;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 1px rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.2)}
.btn-r{background:linear-gradient(135deg,#f43f5e,#fb923c)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:.8rem;color:rgba(255,255,255,.7)}
td{padding:.75rem .8rem;border-top:1px solid rgba(255,255,255,.12);font-size:.9rem}
tr.row:hover{background:rgba(255,255,255,.07)}
.sw{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;transition:.25s;border:1px solid rgba(255,255,255,.3)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw.on{background:linear-gradient(135deg,#10b981,#06b6d4)}.sw.on::after{left:22px}
label.l{font-size:.8rem;color:rgba(255,255,255,.75);margin:0 0 .25rem .25rem;display:block}
.card{position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(220px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.3),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.ticker{overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 30s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.dot{width:10px;height:10px;border-radius:50%;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 10px transparent}}
</style>
</head>

['Aadhaar Update','fingerprint','from-pink-500/40','Existing Aadhaar, supporting ID / address proof, linked mobile'],

['Bank / AePS Services','landmark','from-sky-500/40','Aadhaar number & bank-linked biometric'],

/* ===== Data layer: shared db when available, otherwise this browser's localStorage ===== */
const S={user:null,records:[],ops:[],views:[],files:[],apps:[],opTab:'entry',folder:null,notice:'',q:'',tab:'records',mode:'local'};
let DB=null;const subs={};
async function initStore(){
  try{if(window.claude&&claude.use){DB=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),3000))]);}}catch(e){DB=null}
  S.mode=DB?'shared':'local';
  ['records','operators','views','files','settings','apps'].forEach(c=>sub(c,rows=>{if(c==='records')S.records=rows.sort((a,b)=>a.slno-b.slno);else if(c==='views')S.views=rows.sort((a,b)=>b.last-a.last);else if(c==='apps')S.apps=rows.sort((a,b)=>b.at-a.at);else if(c==='settings')S.notice=(rows.find(x=>x.id==='notice')||{}).text||'';else if(c==='files')S.files=rows.sort((a,b)=>b.at-a.at);else S.ops=rows;render()}));
}
const lk=c=>'imd_'+c;
const lread=c=>{try{return JSON.parse(localStorage.getItem(lk(c))||'{}')}catch(e){return{}}};
function sub(c,cb){
  if(DB){DB.collection(c).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});}
  else{const f=()=>cb(Object.entries(lread(c)).map(([id,v])=>({id,...v})));f();addEventListener('storage',f);subs[c]=f;}
}
async function put(c,id,o){
  if(DB)return DB.collection(c).doc(id).set(o);
  try{const m=lread(c);m[id]=o;localStorage.setItem(lk(c),JSON.stringify(m));}catch(e){toast('Storage full – try a smaller PDF')}
  subs[c]&&subs[c]();
}
async function del(c,id){
  if(DB)return DB.collection(c).doc(id).delete();
  try{const m=lread(c);delete m[id];localStorage.setItem(lk(c),JSON.stringify(m));}catch(e){}
  subs[c]&&subs[c]();
}

/* ===== helpers ===== */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='w-5 h-5')=>`<i data-lucide="${n}" class="${c}"></i>`;
const fmtA=v=>String(v).replace(/\D/g,'').slice(0,12).replace(/(\d{4})(?=\d)/g,'$1 ');
const mask=(v,k=4)=>v?'•'.repeat(Math.max(0,String(v).replace(/\s/g,'').length-k))+String(v).replace(/\s/g,'').slice(-k):'—';
function toast(m){const t=$('#toast');t.innerHTML=`<div class="glass glass-sm px-5 py-3 text-sm">${esc(m)}</div>`;setTimeout(()=>t.innerHTML='',2800)}
function modal(h){$('#modal').innerHTML=h?`<div class="modal" data-act="bd"><div class="glass p-6 w-full max-w-lg">${h}</div></div>`:'';icons()}

function ist(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}))}
function isOpen(d){const h=d.getHours()+d.getMinutes()/60;return h>=CFG.hours[0]&&h<CFG.hours[1]}
function bar(){
  const f=h=>(h%12||12)+(h<12?' AM':' PM');
  return `<div class="glass glass-sm mt-4 px-4 py-2 flex items-center gap-4 text-sm" style="border-radius:18px">
   <div class="flex items-center gap-2 shrink-0"><span id="dot" class="dot"></span><b id="st"></b><span class="text-white/60 hidden sm:inline" id="clk"></span><span class="text-white/50 hidden md:inline">· ${f(CFG.hours[0])} – ${f(CFG.hours[1])}</span></div>
   <div class="border-l border-white/20 pl-4 flex items-center flex-1 min-w-0">${ic('megaphone','w-4 h-4 mr-2 shrink-0')}<div class="ticker"><span>${esc(S.notice||CFG.notice)}</span></div></div></div>`;
}
function tickClk(){
  const st=$('#st');if(!st)return;const d=ist(),o=isOpen(d),c=o?'#34d399':'#fb7185';
  st.textContent=o?'OPEN NOW':'CLOSED';st.style.color=c;$('#dot').style.cssText='color:'+c+';background:currentColor';
  $('#clk').textContent=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClk,1000);
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-r.left)+'px');c.style.setProperty('--y',(e.clientY-r.top)+'px')});
function hero(){
  return `<section class="text-center py-10 sm:py-14">
   <h2 class="text-3xl sm:text-5xl font-extrabold bg-gradient-to-r from-white via-violet-200 to-cyan-200 bg-clip-text text-transparent">PATHARGHATIYA PANCHAYAT</h2>
   <p class="mt-3 text-white/70 max-w-xl mx-auto">PAN, Voter Card, PM Kisan, Aadhaar and more – fast, secure and trusted CSC services for our village.</p>
   <button class="btn mt-6" data-act="loginmenu">${ic('log-in','w-4 h-4')}Login to Portal</button></section>`;
}
function services(){
  return `<section class="mt-8"><h3 class="text-lg font-bold mb-4 flex items-center gap-2">${ic('sparkles')}Our Services</h3>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-5">${SERVICES.map((s,i)=>`
   <div class="glass card p-5 bg-gradient-to-br ${s[2]} to-transparent" data-act="svc" data-i="${i}">
    <div class="w-12 h-12 rounded-2xl glass glass-sm grid place-items-center mb-3">${ic(s[1],'w-6 h-6')}</div>
    <div class="font-semibold leading-tight">${s[0]}</div>
    <div class="text-xs text-white/60 mt-1 flex items-center gap-1">Details ${ic('arrow-right','w-3 h-3')}</div></div>`).join('')}</div></section>`;
}
function opForm(){
  const mine=S.records.filter(r=>r.by===S.user.name).length;
  const f=(id,l,ph,ex='')=>`<div><label class="l">${l}</label><input class="inp" id="${id}" placeholder="${ph}" ${ex}></div>`;
  return `<section class="glass p-5 sm:p-7 mt-6"><div class="flex justify-between items-center mb-5 flex-wrap gap-2">
   <h3 class="text-lg font-bold flex items-center gap-2">${ic('file-plus-2')}Data Entry Form</h3>
   <span class="text-sm text-white/70">Entries by you: <b>${mine}</b></span></div>
   <form id="entry" class="grid sm:grid-cols-2 gap-4">
    ${f('f_name','Name','Full name')}${f('f_father','Father / Husband Name','Father or husband name')}
    ${f('f_aadhaar','Aadhaar No','XXXX XXXX XXXX','inputmode="numeric" maxlength="14"')}${f('f_parcha','Parcha No','Parcha number')}
    ${f('f_pan','PAN No','ABCDE1234F','maxlength="10" style="text-transform:uppercase"')}${f('f_acc','Account No','Bank account number','inputmode="numeric"')}
    ${f('f_ifsc','IFSC Code','SBIN0001234','maxlength="11" style="text-transform:uppercase"')}
    <div><label class="l">PDF Document (max ${MAXT()})</label><input class="inp" id="f_pdf" type="file" accept="application/pdf"></div>
    <div class="sm:col-span-2 flex gap-3"><button class="btn">${ic('send','w-4 h-4')}Submit to Admin</button><button type="reset" class="btn btn-g">Clear</button></div>
   </form></section>`;
}
function filtered(){
  const q=S.q.toLowerCase().trim();if(!q)return S.records;
  return S.records.filter(r=>[r.slno,r.name,r.father,r.aadhaar,r.parcha,r.pan,r.acc,r.ifsc,r.by].join(' ').toLowerCase().includes(q));
}

  const fields=role==='public'?`<input class="inp" id="l_a" placeholder="Your name" required><input class="inp" id="l_b" placeholder="Mobile number" inputmode="numeric" maxlength="10" required>`

  modal(`<h3 class="text-xl font-bold mb-4 flex items-center gap-2">${ic(t[1])}${t[0]}</h3>

function download(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const fallback=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()};
  try{claude.use('downloads').then(d=>d?d.save({filename:name,data:blob}).catch(fallback):fallback()).catch(fallback)}catch(e){fallback()}
}
const d2b=u=>{const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5,h.indexOf(';'))||'application/octet-stream'})};
function dlData(name,u){const blob=d2b(u);download(name,blob,blob.type)}
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function prep(f){
  if(!/^image\//.test(f.type))return f.size>MAXB()?null:rd(f);
  const img=new Image();img.src=await rd(f);await new Promise(r=>img.onload=r);
  for(const m of [1000,700,450]){const k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.8);if(u.length<200000)return u}
  return null;
}
const MAXB=()=>DB?5*1024*1024:150*1024,MAXT=()=>DB?'5 MB':'150 KB',CH=150000;
async function packData(u,force){
  if(!DB||(!force&&u.length<=CH))return{data:u};
  const cid='c'+Date.now()+Math.random().toString(36).slice(2,6),n=Math.ceil(u.length/CH);
  for(let i=0;i<n;i+=6)await Promise.all([...Array(Math.min(6,n-i))].map((_,k)=>put('chunks',cid+'_'+(i+k),{d:u.slice((i+k)*CH,(i+k+1)*CH)})));
  return{cid,n};
}
async function loadData(o){
  if(o.data)return o.data;if(!o.cid)return '';
  let out='';for(let i=0;i<o.n;i++){const x=await DB.collection('chunks').doc(o.cid+'_'+i).get();out+=x.data().d}
  return out;
}
async function dropData(o){if(DB&&o&&o.cid)for(let i=0;i<o.n;i++)await del('chunks',o.cid+'_'+i).catch(()=>{})}
const cols=[['SL No','slno'],['Name','name'],['Father/Husband','father'],['Aadhaar','aadhaar'],['Parcha No','parcha'],['PAN','pan'],['Account No','acc'],['IFSC','ifsc'],['Entered By','by'],['Published',r=>r.pub?'Yes':'No']];
const val=(r,c)=>typeof c[1]==='function'?c[1](r):r[c[1]];
function printPdf(rs,title){
  const h=`<html><head><title>${title}</title><style>body{font-family:Arial;padding:20px}h2{margin:0}table{border-collapse:collapse;width:100%;font-size:11px;margin-top:12px}th,td{border:1px solid #888;padding:5px;text-align:left}th{background:#eee}</style></head><body><h2>${CFG.name}</h2><div>${CFG.addr} · ${CFG.phone} · ${CFG.email}</div><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rs.map(r=>`<tr>${cols.map(c=>`<td>${esc(val(r,c))}</td>`).join('')}</tr>`).join('')}</table></body></html>`;
  const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);
  f.srcdoc=h;f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){download(title+'.html',h,'text/html');toast('Saved as printable HTML – open and print to PDF')}setTimeout(()=>f.remove(),4000)};
}
function csv(rs){return '\ufeff'+[cols.map(c=>c[0]),...rs.map(r=>cols.map(c=>val(r,c)))].map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='bd'&&e.target!==el)return;
  const a=el.dataset.act,id=el.dataset.id,r=S.records.find(x=>x.id===id);
  if(a==='close'||a==='bd')modal('');
  else if(a==='loginmenu')modal(`<h3 class="text-xl font-bold mb-4">Choose Login</h3><div class="space-y-3">
   ${[['admin','shield','Admin Login','Full control panel'],['operator','keyboard','Operator Login','Data entry only'],['public','home','Public / Village Login','Check published records']].map(x=>`<button class="glass glass-sm card p-4 w-full flex items-center gap-4 text-left" data-act="lf" data-role="${x[0]}">${ic(x[1],'w-7 h-7')}<div><div class="font-semibold">${x[2]}</div><div class="text-xs text-white/60">${x[3]}</div></div></button>`).join('')}</div>`);
  else if(a==='lf')loginForm(el.dataset.role);
  else if(a==='logout'){S.user=null;S.q='';render()}
  else if(a==='svc'){const s=SERVICES[el.dataset.i];modal(`<div class="flex items-center gap-3 mb-3"><div class="w-12 h-12 rounded-2xl glass glass-sm grid place-items-center">${ic(s[1],'w-6 h-6')}</div><h3 class="text-xl font-bold">${s[0]}</h3></div>
   <p class="text-sm text-white/60">Documents required</p><p class="mb-4">${s[3]}</p>
   <p class="text-sm text-white/70 mb-4">Visit ${CFG.name} or call / WhatsApp ${CFG.phone} to apply.</p>
   <div class="flex gap-2"><button class="btn flex-1" data-act="close">Close</button></div>`)}
  else if(a==='savenotice'){await put('settings','notice',{text:$('#notice_in').value.trim()});toast('Notice updated')}
  else if(a==='optab'){S.opTab=el.dataset.t==='entry'?'entry':+el.dataset.t;render()}
  else if(a==='folder'){S.folder=el.dataset.i===''?null:+el.dataset.i;render()}
  else if(a==='adoc'||a==='adl'){const ap=S.apps.find(x=>x.id===id),d=ap&&ap.docs[+el.dataset.k];if(!d)return;toast('Opening…');const u=await loadData(d);
    if(a==='adoc'&&/image/.test(d.type))modal(`<img src="${u}" class="w-full max-h-[70vh] object-contain rounded-xl"><div class="flex gap-2 mt-4"><button class="btn flex-1" data-act="adl" data-id="${id}" data-k="${el.dataset.k}">${ic('download','w-4 h-4')}Download</button><button class="btn btn-g" data-act="close">Close</button></div>`);
    else dlData(d.name,u)}
  else if(a==='delapp'&&confirm('Delete this application and its documents?')){const ap=S.apps.find(x=>x.id===id);if(ap){for(const d of ap.docs)await dropData(d);await del('apps',id)}}
  else if(a==='tab'){S.tab=el.dataset.t;render()}
  else if(a==='pub'&&r){await put('records',id,{...r,pub:!r.pub});toast(r.pub?'Hidden from public':'Published to village login')}
  else if(a==='delrec'&&r&&confirm('Delete this record?')){await dropData(r.pdfc);await del('records',id)}
  else if(a==='delop'&&confirm('Remove operator?'))await del('operators',id);
  else if(a==='xls')download('imran-digital-records.csv',csv(filtered()),'text/csv');
  else if(a==='pdfall')printPdf(filtered(),'IMRAN DIGITAL Records');
  else if(a==='pdf1'&&r)printPdf([r],'Record '+r.slno);
  else if(a==='edit'&&r){
   const f=(k,l,ex='')=>`<div><label class="l">${l}</label><input class="inp" id="e_${k}" value="${esc(r[k])}" ${ex}></div>`;
   modal(`<h3 class="text-xl font-bold mb-4">Edit Record #${r.slno}</h3><form id="editf" data-id="${r.id}" class="grid grid-cols-2 gap-3">
   ${f('name','Name')}${f('father','Father / Husband')}${f('aadhaar','Aadhaar No','inputmode="numeric" maxlength="14"')}${f('parcha','Parcha No')}
   ${f('pan','PAN No','maxlength="10"')}${f('acc','Account No')}${f('ifsc','IFSC Code','maxlength="11"')}
   <div><label class="l">Replace PDF (${(r.pdf||r.pdfc)?'one attached':'none'})</label><input class="inp" id="e_pdf" type="file" accept="application/pdf"></div>
   <div class="col-span-2 flex gap-2"><button class="btn flex-1">${ic('save','w-4 h-4')}Save Changes</button><button type="button" class="btn btn-g" data-act="close">Cancel</button></div></form>`);}
  else if(a==='dlpdf'&&r){toast('Preparing download…');dlData((r.name||'record')+'.pdf',await loadData({data:r.pdf,cid:r.pdfc?.cid,n:r.pdfc?.n}))}
  else if(a==='fpub'||a==='fdl'||a==='fdel'){const f=S.files.find(x=>x.id===id);if(!f)return;
    if(a==='fpub'){await put('files',id,{...f,pub:!f.pub});toast(f.pub?'Hidden from public':'File published to village login')}
    else if(a==='fdl'){toast('Preparing download…');dlData(f.name,await loadData(f))}
    else if(confirm('Delete this file?')){await dropData(f);await del('files',id)}}
  else if(a==='view'&&r)modal(`<h3 class="text-xl font-bold mb-4">Record #${r.slno}</h3><div class="grid grid-cols-2 gap-3 text-sm">
   ${cols.slice(1).map(c=>`<div><div class="text-white/50 text-xs">${c[0]}</div><div>${esc(val(r,c))||'—'}</div></div>`).join('')}</div>
   <div class="flex gap-2 mt-5">${(r.pdf||r.pdfc)?`<button class="btn" data-act="dlpdf" data-id="${r.id}">${ic('file-down','w-4 h-4')}Attached PDF</button>`:'<span class="text-white/50 text-sm self-center">No PDF attached</span>'}<button class="btn btn-g ml-auto" data-act="close">Close</button></div>`);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;render()}
  if(e.target.id==='f_aadhaar'||e.target.id==='e_aadhaar')e.target.value=fmtA(e.target.value);
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='lf'){
    const role=f.dataset.role,a=$('#l_a').value.trim(),b=$('#l_b').value;
    if(role==='admin'){if(a.toLowerCase()===CFG.admin.email&&b===CFG.admin.pass)S.user={role,name:'Admin'};else return toast('Invalid admin credentials')}
    else if(role==='operator'){const o=S.ops.find(x=>x.id===a.toLowerCase());if(o&&o.pass===b)S.user={role,name:o.name};else return toast('Invalid operator login')}
    else{if(b.length<10)return toast('Enter a 10-digit mobile number');S.user={role,name:a};try{const old=S.views.find(v=>v.id===b);put('views',b,{name:a,mobile:b,visits:(old?.visits||0)+1,last:Date.now()}).catch(()=>{})}catch(e){}}
    S.q='';modal('');render();
  }
  if(f.id==='opf'){
    const id=$('#o_user').value.trim().toLowerCase();
    if(S.ops.some(o=>o.id===id))return toast('Username already exists');
    await put('operators',id,{name:$('#o_name').value.trim(),pass:$('#o_pass').value});toast('Operator created');
  }
  if(f.id==='appf'){
    const sv=SERVICES[+f.dataset.svc],labels=DOCS[sv[0]]||['Document 1','Document 2'];
    const name=$('#a_name').value.trim(),mob=$('#a_mob').value.trim(),note=$('#a_note').value.trim();
    const files=labels.map((l,k)=>[l,$('#a_d'+k).files[0]]).filter(x=>x[1]);
    if(!name&&!files.length)return toast('Enter applicant name or attach a document');
    toast('Uploading…');const docs=[];
    for(const [label,file] of files){
      const u=await prep(file);if(!u)return toast(label+' is too large – max '+MAXT());
      const img=/^image\//.test(file.type),pk=await packData(u,true);
      docs.push({label,name:img?file.name.replace(/\.[^.]+$/,'')+'.jpg':file.name,type:img?'image/jpeg':(file.type||'application/octet-stream'),...pk});
    }
    await put('apps','a'+Date.now(),{svc:sv[0],name,mob,note,docs,by:S.user.name,at:Date.now()});
    f.reset();toast('Sent to Admin – '+sv[0]+' folder');
  }
  if(f.id==='filef'){
    const file=$('#u_file').files[0];if(!file)return;
    const data=await prep(file);if(!data)return toast('File too large – max '+MAXT());
    toast('Uploading…');const pk=/^image\//.test(file.type)?{data}:await packData(data);
    await put('files','f'+Date.now(),{title:$('#u_title').value.trim(),name:file.name,type:file.type||'application/octet-stream',...pk,pub:false,at:Date.now()});
    f.reset();toast('File uploaded – switch it on to publish');
  }
  if(f.id==='editf'){
    const r=S.records.find(x=>x.id===f.dataset.id);if(!r)return;
    const g=k=>$('#e_'+k).value.trim(),aad=g('aadhaar').replace(/\s/g,''),pan=g('pan').toUpperCase(),ifsc=g('ifsc').toUpperCase();
    if(aad&&aad.length!==12)return toast('Aadhaar must be 12 digits (or leave it empty)');
    const dupE=aad&&S.records.find(x=>x.id!==r.id&&String(x.aadhaar).replace(/\s/g,'')===aad);
    if(dupE)return toast('Duplicate! This Aadhaar already exists at SL No '+dupE.slno+' ('+dupE.name+')');
    if(pan&&!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan))return toast('Invalid PAN format (ABCDE1234F)');
    if(ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return toast('Invalid IFSC code');
    let np={};const file=$('#e_pdf').files[0];
    if(file){if(file.size>MAXB())return toast('PDF is too large – max '+MAXT());
      toast('Uploading…');const pk=await packData(await rd(file));await dropData(r.pdfc);np={pdf:pk.data||'',pdfc:pk.cid?{cid:pk.cid,n:pk.n}:null}}
    await put('records',r.id,{...r,name:g('name'),father:g('father'),aadhaar:aad?fmtA(aad):'',parcha:g('parcha'),pan,acc:g('acc'),ifsc,...np,edited:Date.now()});
    modal('');toast('Record updated');
  }
  if(f.id==='entry'){
    const aad=$('#f_aadhaar').value.replace(/\s/g,''),pan=$('#f_pan').value.toUpperCase(),ifsc=$('#f_ifsc').value.toUpperCase();
    if(aad&&aad.length!==12)return toast('Aadhaar must be 12 digits (or leave it empty)');
    const dup=aad&&S.records.find(x=>String(x.aadhaar).replace(/\s/g,'')===aad);
    if(dup)return toast('Duplicate! This Aadhaar is already entered at SL No '+dup.slno+' ('+dup.name+')');
    if(pan&&!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan))return toast('Invalid PAN format (ABCDE1234F)');
    if(ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return toast('Invalid IFSC code');
    if(![...f.querySelectorAll('input')].some(i=>i.value.trim()))return toast('Fill at least one field');
    let pdf='',pdfc=null;const file=$('#f_pdf').files[0];
    if(file){if(file.size>MAXB())return toast('PDF is too large – max '+MAXT());
      toast('Uploading…');const pk=await packData(await rd(file));pdf=pk.data||'';pdfc=pk.cid?{cid:pk.cid,n:pk.n}:null}
    const slno=Math.max(0,...S.records.map(r=>r.slno||0))+1,id='r'+Date.now();
    await put('records',id,{slno,name:$('#f_name').value.trim(),father:$('#f_father').value.trim(),aadhaar:aad?fmtA(aad):'',parcha:$('#f_parcha').value.trim(),pan,acc:$('#f_acc').value.trim(),ifsc,pdf,...(pdfc?{pdfc}:{}),by:S.user.name,pub:false,at:Date.now()});
    f.reset();toast('Saved – sent to Admin dashboard (SL '+slno+')');
  }
});
render();initStore();
</script>
</body>
</html>
